[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parseo"
version = "0.4.4"  # or remove this and use setuptools-scm below
description = "Filename parser/assembler for satellite data"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Matteo Mattiuzzi", email = "matteo@mattiuzzi.com" }]
keywords = ["satellite", "remote-sensing", "filenames", "sentinel", "parsing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/copernicus-land/parsEO"
Repository = "https://github.com/copernicus-land/parsEO.git"
Issues = "https://github.com/copernicus-land/parsEO/issues"
Changelog = "https://github.com/copernicus-land/parsEO/releases"

[project.scripts]
parseo = "parseo.cli:main"

# If you want optional extras:
[project.optional-dependencies]
dev = ["build", "twine", "ruff", "mypy", "pytest", "pytest-cov"]
web = ["fastapi", "uvicorn"]

[tool.setuptools]
include-package-data = true  # ensure MANIFEST.in if you ship data

[tool.setuptools.packages.find]
where = ["src"]
include = ["parseo*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# If you ship package data (e.g., *.json inside parseo/):
# [tool.setuptools.package-data]
# "parseo" = ["data/*.json"]

